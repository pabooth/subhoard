name: CodeRabbit Reviewed

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read

jobs:
  coderabbit-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CodeRabbit reviewed the latest commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Dependabot version bumps are covered by CI and CodeQL; CodeRabbit
          # only sees the version string change, not the upstream code.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: CodeRabbit review not required."
            exit 0
          fi

          REVIEWED_SHAS=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "coderabbitai[bot]") | .commit_id')

          if [ -z "$REVIEWED_SHAS" ]; then
            echo "No CodeRabbit review found on this PR (CodeRabbit may have hit a rate limit or skipped this PR)."
            echo "Comment '@coderabbitai review' to request one."
            exit 1
          fi

          if ! grep -qx "$HEAD_SHA" <<< "$REVIEWED_SHAS"; then
            echo "CodeRabbit has not reviewed the latest commit (${HEAD_SHA})."
            echo "Wait for its incremental review, or comment '@coderabbitai review' to request one."
            exit 1
          fi

          echo "CodeRabbit has reviewed ${HEAD_SHA}. Check passed."
