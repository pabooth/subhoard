name: CodeRabbit Reviewed

# The app's own "CodeRabbit" check reports "skipped" when no review happens,
# and GitHub treats skipped as passing for required checks. This job waits
# for that check on the PR head commit and passes only if it succeeded,
# i.e. CodeRabbit actually reviewed the commit. A clean review does not
# submit a GitHub review, so the reviews API cannot be used for this.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: read

jobs:
  coderabbit-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for CodeRabbit to review the head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # CodeRabbit skips PRs from bot accounts ("Bot user detected"), so
          # don't require a review; dependency bumps are covered by CI and CodeQL.
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "PR opened by bot ${PR_AUTHOR}: CodeRabbit review not required."
            exit 0
          fi

          # Poll for up to 20 minutes for the latest CodeRabbit check run.
          for _ in $(seq 1 40); do
            RUN=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?check_name=CodeRabbit" \
              --jq '[.check_runs[] | select(.app.slug == "coderabbitai")] | sort_by(.id) | last // empty
                    | "\(.status) \(.conclusion) \(.output.title)"')
            STATUS=${RUN%% *}
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            echo "Waiting for CodeRabbit (${RUN:-no check run yet}) ..."
            sleep 30
          done

          echo "CodeRabbit check on ${HEAD_SHA}: ${RUN:-none}"
          CONCLUSION=$(echo "$RUN" | cut -d' ' -f2)
          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
            echo "CodeRabbit reviewed the head commit. Check passed."
            exit 0
          fi

          echo "CodeRabbit has not reviewed the head commit (it may have skipped or been rate-limited)."
          echo "Comment '@coderabbitai full review', wait for it to finish, then re-run this job."
          echo "('@coderabbitai review' does not re-review a commit CodeRabbit has already processed.)"
          exit 1
